name: Publish verified git-slop bottles

run-name: >-
  Publish git-slop bottles from release-test run
  #${{ github.event.client_payload.run_id }}

on:
  repository_dispatch:
    types:
      - git-slop-bottles-ready

permissions: {}

concurrency:
  group: git-slop-formula-publication
  cancel-in-progress: false

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      actions: read
      checks: read
      contents: write
      pull-requests: write
    env:
      EVENT_RUN_ID: ${{ github.event.client_payload.run_id }}
    steps:
      - name: Resolve and validate the trusted release-test run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$EVENT_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          test "$GITHUB_WORKFLOW_REF" = \
            "${GITHUB_REPOSITORY}/.github/workflows/publish.yml@refs/heads/main"

          jq -e \
            --argjson run_id "$EVENT_RUN_ID" \
            --arg owner "$GITHUB_REPOSITORY_OWNER" '
              .action == "git-slop-bottles-ready" and
              (.client_payload | keys) == ["run_id"] and
              .client_payload.run_id == $run_id and
              (
                (
                  .sender.login == "github-actions[bot]" and
                  .sender.type == "Bot"
                ) or
                (
                  .sender.login == $owner and
                  .sender.type == "User"
                )
              )
            ' "$GITHUB_EVENT_PATH" >/dev/null

          workflow_json="$RUNNER_TEMP/release-tests-workflow.json"
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/release-tests.yml" \
            > "$workflow_json"
          workflow_id="$(jq -r .id "$workflow_json")"
          [[ "$workflow_id" =~ ^[1-9][0-9]*$ ]]
          test "$(jq -r .name "$workflow_json")" = \
            "Release git-slop bottles"
          test "$(jq -r .path "$workflow_json")" = \
            ".github/workflows/release-tests.yml"
          test "$(jq -r .state "$workflow_json")" = "active"

          run_json="$RUNNER_TEMP/release-test-event.json"
          for attempt in $(seq 1 24); do
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${EVENT_RUN_ID}" \
              > "$run_json"
            run_status="$(jq -r .status "$run_json")"
            case "$run_status" in
              completed)
                break
                ;;
              queued|in_progress|requested|waiting|pending)
                if [[ "$attempt" == "24" ]]; then
                  echo "Timed out waiting for release-test run ${EVENT_RUN_ID} to complete." >&2
                  exit 1
                fi
                sleep 5
                ;;
              *)
                echo "Unexpected release-test run status: ${run_status}" >&2
                exit 1
                ;;
            esac
          done

          event_run_attempt="$(jq -r .run_attempt "$run_json")"
          event_head_sha="$(jq -r .head_sha "$run_json")"
          event_head_branch="$(jq -r .head_branch "$run_json")"
          event_run_url="$(jq -r .html_url "$run_json")"
          [[ "$event_run_attempt" =~ ^[1-9][0-9]*$ ]]
          [[ "$event_head_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$event_head_branch" =~ ^automation/git-slop-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$event_run_url" == "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${EVENT_RUN_ID}" ]]

          jq -e \
            --argjson run_id "$EVENT_RUN_ID" \
            --argjson run_attempt "$event_run_attempt" \
            --argjson workflow_id "$workflow_id" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg head_sha "$event_head_sha" \
            --arg head_branch "$event_head_branch" '
              .id == $run_id and
              .run_attempt == $run_attempt and
              .workflow_id == $workflow_id and
              .path == ".github/workflows/release-tests.yml" and
              .event == "workflow_dispatch" and
              .status == "completed" and
              .conclusion == "success" and
              .repository.full_name == $repository and
              .head_repository.full_name == $repository and
              .actor.login == "github-actions[bot]" and
              .actor.type == "Bot" and
              .triggering_actor.login == "github-actions[bot]" and
              .triggering_actor.type == "Bot" and
              .head_sha == $head_sha and
              .head_branch == $head_branch
            ' "$run_json" >/dev/null

          {
            echo "EVENT_RUN_ATTEMPT=$event_run_attempt"
            echo "EVENT_HEAD_SHA=$event_head_sha"
            echo "EVENT_HEAD_BRANCH=$event_head_branch"
            echo "EVENT_RUN_URL=$event_run_url"
          } >> "$GITHUB_ENV"

      - name: Check out trusted tap main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: main

      - name: Verify the checked-out publisher is current trusted main
        run: |
          origin_main="$(git rev-parse origin/main)"
          live_main="$(
            git ls-remote origin refs/heads/main |
              awk 'NR == 1 { print $1 }'
          )"
          test -n "$live_main"
          test "$origin_main" = "$live_main"
          test "$(git rev-parse HEAD)" = "$live_main"

      - name: Load immutable release metadata from the event head
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            "repos/${GITHUB_REPOSITORY}/contents/metadata/git-slop-release.json?ref=${EVENT_HEAD_SHA}" \
            --jq .content |
            tr -d '\n' |
            base64 --decode > "$RUNNER_TEMP/git-slop-release.json"
          gh api \
            "repos/${GITHUB_REPOSITORY}/contents/Formula/git-slop.rb?ref=${EVENT_HEAD_SHA}" \
            --jq .content |
            tr -d '\n' |
            base64 --decode > "$RUNNER_TEMP/git-slop-pr.rb"

          jq -e '
            (keys | sort) == [
              "crate_source",
              "formula",
              "project",
              "release_manifest",
              "revision",
              "schema_version",
              "version"
            ] and
            .schema_version == 1 and
            .project == "git-slop" and
            (.version | type == "string") and
            (.revision | type == "string") and
            (.formula | keys | sort) == ["sha256", "url"] and
            (.release_manifest | keys | sort) == ["sha256", "url"] and
            (.crate_source | keys | sort) == ["sha256", "url"]
          ' "$RUNNER_TEMP/git-slop-release.json" >/dev/null

          version="$(jq -r .version "$RUNNER_TEMP/git-slop-release.json")"
          revision="$(jq -r .revision "$RUNNER_TEMP/git-slop-release.json")"
          formula_url="$(jq -r .formula.url "$RUNNER_TEMP/git-slop-release.json")"
          formula_sha256="$(jq -r .formula.sha256 "$RUNNER_TEMP/git-slop-release.json")"
          manifest_url="$(jq -r .release_manifest.url "$RUNNER_TEMP/git-slop-release.json")"
          manifest_sha256="$(jq -r .release_manifest.sha256 "$RUNNER_TEMP/git-slop-release.json")"
          crate_url="$(jq -r .crate_source.url "$RUNNER_TEMP/git-slop-release.json")"
          crate_sha256="$(jq -r .crate_source.sha256 "$RUNNER_TEMP/git-slop-release.json")"

          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          [[ "$formula_sha256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$manifest_sha256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$crate_sha256" =~ ^[0-9a-f]{64}$ ]]
          test "$EVENT_HEAD_BRANCH" = "automation/git-slop-v${version}"
          release_base="https://github.com/coreycoto/git-slop/releases/download/v${version}"
          test "$formula_url" = "${release_base}/git-slop.rb"
          test "$manifest_url" = "${release_base}/release-manifest.json"
          test "$crate_url" = \
            "https://static.crates.io/crates/git-slop/git-slop-${version}.crate"

          {
            echo "version=$version"
            echo "revision=$revision"
            echo "formula_url=$formula_url"
            echo "formula_sha256=$formula_sha256"
            echo "manifest_url=$manifest_url"
            echo "manifest_sha256=$manifest_sha256"
            echo "crate_url=$crate_url"
            echo "crate_sha256=$crate_sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve exact bottle release state
        id: bottle-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          release_tag="git-slop-bottles-v2-${RELEASE_VERSION}"
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            > "$RUNNER_TEMP/existing-bottle-releases.json"
          jq --arg tag "$release_tag" \
            '[.[][] | select(.tag_name == $tag)]' \
            "$RUNNER_TEMP/existing-bottle-releases.json" \
            > "$RUNNER_TEMP/matching-bottle-releases.json"
          match_count="$(jq 'length' "$RUNNER_TEMP/matching-bottle-releases.json")"
          test "$match_count" -le 1
          if test "$match_count" = 0; then
            state=absent
            release_id=
          else
            jq -e --arg tag "$release_tag" --arg revision "$EVENT_HEAD_SHA" '
              .[0].tag_name == $tag and
              .[0].target_commitish == $revision and
              .[0].prerelease == false and
              (
                (.[0].draft == true and .[0].immutable == false) or
                (.[0].draft == false and .[0].immutable == true)
              )
            ' "$RUNNER_TEMP/matching-bottle-releases.json" >/dev/null
            release_id="$(jq -r '.[0].id' "$RUNNER_TEMP/matching-bottle-releases.json")"
            [[ "$release_id" =~ ^[1-9][0-9]*$ ]]
            if test "$(jq -r '.[0].draft' "$RUNNER_TEMP/matching-bottle-releases.json")" = true; then
              state=draft
            else
              state=immutable
            fi
          fi
          {
            echo "release-id=$release_id"
            echo "state=$state"
            echo "tag=$release_tag"
          } >> "$GITHUB_OUTPUT"

      - name: Reverify release identity and exact source formula
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
          RELEASE_REVISION: ${{ steps.metadata.outputs.revision }}
          FORMULA_URL: ${{ steps.metadata.outputs.formula_url }}
          FORMULA_SHA256: ${{ steps.metadata.outputs.formula_sha256 }}
          MANIFEST_URL: ${{ steps.metadata.outputs.manifest_url }}
          MANIFEST_SHA256: ${{ steps.metadata.outputs.manifest_sha256 }}
          CRATE_URL: ${{ steps.metadata.outputs.crate_url }}
          CRATE_SHA256: ${{ steps.metadata.outputs.crate_sha256 }}
        run: |
          scripts/verify-git-slop-release.sh "$RUNNER_TEMP/git-slop-verified"
          cmp \
            "$RUNNER_TEMP/git-slop-verified/git-slop.rb" \
            "$RUNNER_TEMP/git-slop-pr.rb"

      - name: Check whether the exact release is already published
        id: publication
        run: |
          if git cat-file -e HEAD:metadata/git-slop-release.json 2>/dev/null &&
            cmp \
              <(git show HEAD:metadata/git-slop-release.json) \
              "$RUNNER_TEMP/git-slop-release.json"
          then
            git show HEAD:Formula/git-slop.rb > "$RUNNER_TEMP/git-slop-main.rb"
            scripts/verify-git-slop-formula-state.sh \
              "$RUNNER_TEMP/git-slop-verified/git-slop.rb" \
              "$RUNNER_TEMP/git-slop-main.rb"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require compatible formula and bottle release state
        env:
          BOTTLE_RELEASE_STATE: ${{ steps.bottle-release.outputs.state }}
          FORMULA_PUBLISHED: ${{ steps.publication.outputs.published }}
        run: |
          case "${FORMULA_PUBLISHED}:${BOTTLE_RELEASE_STATE}" in
            false:absent|false:draft|true:draft|true:immutable)
              ;;
            false:immutable)
              echo "An immutable bottle release exists before its formula was published." >&2
              exit 1
              ;;
            *)
              echo "Unexpected formula/bottle release state: ${FORMULA_PUBLISHED}:${BOTTLE_RELEASE_STATE}" >&2
              exit 1
              ;;
          esac

      - name: Resolve and verify the unique automation pull request
        id: pull-request
        if: steps.publication.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          live_main="$(
            git ls-remote origin refs/heads/main |
              awk 'NR == 1 { print $1 }'
          )"
          remote_head="$(
            git ls-remote origin "refs/heads/${EVENT_HEAD_BRANCH}" |
              awk 'NR == 1 { print $1 }'
          )"
          test -n "$live_main"
          test "$(git rev-parse HEAD)" = "$live_main"
          test "$remote_head" = "$EVENT_HEAD_SHA"

          commit_json="$RUNNER_TEMP/event-head-commit.json"
          gh api \
            "repos/${GITHUB_REPOSITORY}/commits/${EVENT_HEAD_SHA}" \
            > "$commit_json"
          jq -e \
            --arg head_sha "$EVENT_HEAD_SHA" \
            --arg base_sha "$live_main" '
              .sha == $head_sha and
              (.parents | length) == 1 and
              .parents[0].sha == $base_sha
            ' "$commit_json" >/dev/null

          prs_json="$RUNNER_TEMP/automation-pull-requests.json"
          gh api --method GET "repos/${GITHUB_REPOSITORY}/pulls" \
            -f state=open \
            -f base=main \
            -f head="${GITHUB_REPOSITORY_OWNER}:${EVENT_HEAD_BRANCH}" \
            -f per_page=100 \
            > "$prs_json"
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg branch "$EVENT_HEAD_BRANCH" \
            --arg head_sha "$EVENT_HEAD_SHA" \
            --arg base_sha "$live_main" '
              length == 1 and
              .[0].state == "open" and
              .[0].base.ref == "main" and
              .[0].base.sha == $base_sha and
              .[0].head.repo.full_name == $repository and
              .[0].head.ref == $branch and
              .[0].head.sha == $head_sha and
              .[0].user.login == "github-actions[bot]" and
              .[0].user.type == "Bot"
            ' "$prs_json" >/dev/null
          pull_request="$(jq -r '.[0].number' "$prs_json")"
          [[ "$pull_request" =~ ^[1-9][0-9]*$ ]]

          files_path="$RUNNER_TEMP/pull-request-files.jsonl"
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls/${pull_request}/files" \
            > "$files_path"
          jq -se '
            flatten |
            length == 2 and
            all(
              (.status == "added" or .status == "modified") and
              (has("previous_filename") | not)
            )
          ' "$files_path" >/dev/null
          changed_files="$(
            jq -sr 'flatten | .[].filename' "$files_path" |
              LC_ALL=C sort
          )"
          expected_files=$'Formula/git-slop.rb\nmetadata/git-slop-release.json'
          test "$changed_files" = "$expected_files"

          {
            echo "number=$pull_request"
            echo "base_sha=$live_main"
          } >> "$GITHUB_OUTPUT"

      - name: Require this event to be the newest exact-head successful artifact run
        if: steps.publication.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ steps.pull-request.outputs.number }}
          VERIFIED_BASE_SHA: ${{ steps.pull-request.outputs.base_sha }}
        run: |
          runs_json="$RUNNER_TEMP/git-slop-test-runs.json"
          gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/release-tests.yml/runs" \
            -f event=workflow_dispatch \
            -f head_sha="$EVENT_HEAD_SHA" \
            -f per_page=100 \
            > "$runs_json"
          newest_run="$(
            jq -c \
              --arg head_sha "$EVENT_HEAD_SHA" \
              --arg branch "$EVENT_HEAD_BRANCH" '
                [
                  .workflow_runs[] |
                  select(
                    .event == "workflow_dispatch" and
                    .head_sha == $head_sha and
                    .head_branch == $branch
                  )
                ] |
                sort_by(.run_number) |
                reverse |
                .[0] // empty
              ' "$runs_json"
          )"
          test -n "$newest_run"
          jq -e \
            --argjson event_run_id "$EVENT_RUN_ID" \
            --arg head_sha "$EVENT_HEAD_SHA" \
            --arg branch "$EVENT_HEAD_BRANCH" '
              .id == $event_run_id and
              .path == ".github/workflows/release-tests.yml" and
              .event == "workflow_dispatch" and
              .head_sha == $head_sha and
              .head_branch == $branch and
              .status == "completed" and
              .conclusion == "success"
            ' <<<"$newest_run" >/dev/null || {
              echo "The triggering run is no longer the newest exact-head successful dispatch: ${EVENT_RUN_URL}" >&2
              exit 1
            }

          artifacts_json="$RUNNER_TEMP/git-slop-test-artifacts.json"
          gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${EVENT_RUN_ID}/artifacts" \
            -f per_page=100 \
            > "$artifacts_json"
          jq -e \
            --argjson run_id "$EVENT_RUN_ID" \
            --arg repository_id "$GITHUB_REPOSITORY_ID" \
            --arg head_sha "$EVENT_HEAD_SHA" \
            --arg branch "$EVENT_HEAD_BRANCH" '
            .total_count == 2 and
            ([.artifacts[] | select(.expired == false) | .name] | sort) ==
              ["bottles_macos-26", "bottles_ubuntu-latest"] and
            all(
              .artifacts[];
              .expired == false and
              (.digest | type == "string") and
              (.digest | test("^sha256:[0-9a-f]{64}$")) and
              .workflow_run.id == $run_id and
              (.workflow_run.repository_id | tostring) == $repository_id and
              (.workflow_run.head_repository_id | tostring) == $repository_id and
              .workflow_run.head_sha == $head_sha and
              .workflow_run.head_branch == $branch
            )
          ' "$artifacts_json" >/dev/null || {
            echo "The triggering run does not have both exact unexpired bottle artifacts: ${EVENT_RUN_URL}" >&2
            exit 1
          }

          live_main="$(
            git ls-remote origin refs/heads/main |
              awk 'NR == 1 { print $1 }'
          )"
          remote_head="$(
            git ls-remote origin "refs/heads/${EVENT_HEAD_BRANCH}" |
              awk 'NR == 1 { print $1 }'
          )"
          test "$live_main" = "$VERIFIED_BASE_SHA"
          test "$remote_head" = "$EVENT_HEAD_SHA"

          commit_json="$RUNNER_TEMP/pre-publication-head-commit.json"
          gh api \
            "repos/${GITHUB_REPOSITORY}/commits/${EVENT_HEAD_SHA}" \
            > "$commit_json"
          jq -e \
            --arg head_sha "$EVENT_HEAD_SHA" \
            --arg base_sha "$VERIFIED_BASE_SHA" '
              .sha == $head_sha and
              (.parents | length) == 1 and
              .parents[0].sha == $base_sha
            ' "$commit_json" >/dev/null

          pr_json="$(
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${PULL_REQUEST}"
          )"
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg branch "$EVENT_HEAD_BRANCH" \
            --arg head_sha "$EVENT_HEAD_SHA" \
            --arg base_sha "$VERIFIED_BASE_SHA" '
              .state == "open" and
              .base.ref == "main" and
              .base.sha == $base_sha and
              .head.repo.full_name == $repository and
              .head.ref == $branch and
              .head.sha == $head_sha and
              .user.login == "github-actions[bot]" and
              .user.type == "Bot"
            ' <<<"$pr_json" >/dev/null

      - name: Set up Homebrew
        if: steps.publication.outputs.published != 'true'
        uses: Homebrew/actions/setup-homebrew@df4b09108a1de9d6f995fe68f302b3f68bd6d2ef # 2026.07.20.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up git
        if: steps.publication.outputs.published != 'true'
        id: git_setup
        uses: Homebrew/actions/git-user-config@df4b09108a1de9d6f995fe68f302b3f68bd6d2ef # 2026.07.20.1

      - name: Prepare exact draft bottle release
        if: steps.publication.outputs.published != 'true'
        id: prepare-bottle-release
        env:
          BOTTLE_RELEASE_ID: ${{ steps.bottle-release.outputs.release-id }}
          BOTTLE_RELEASE_STATE: ${{ steps.bottle-release.outputs.state }}
          BOTTLE_RELEASE_TAG: ${{ steps.bottle-release.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if test "$BOTTLE_RELEASE_STATE" = absent; then
            jq -n \
              --arg tag "$BOTTLE_RELEASE_TAG" \
              --arg revision "$EVENT_HEAD_SHA" '
                {
                  tag_name: $tag,
                  target_commitish: $revision,
                  name: $tag,
                  body: "Verified Homebrew bottles for the exact git-slop release.",
                  draft: true,
                  prerelease: false
                }
              ' > "$RUNNER_TEMP/create-bottle-release.json"
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/releases" \
              --input "$RUNNER_TEMP/create-bottle-release.json" \
              > "$RUNNER_TEMP/draft-bottle-release.json"
            BOTTLE_RELEASE_ID="$(jq -r .id "$RUNNER_TEMP/draft-bottle-release.json")"
          else
            gh api "repos/${GITHUB_REPOSITORY}/releases/${BOTTLE_RELEASE_ID}" \
              > "$RUNNER_TEMP/draft-bottle-release.json"
          fi
          [[ "$BOTTLE_RELEASE_ID" =~ ^[1-9][0-9]*$ ]]
          jq -e \
            --arg tag "$BOTTLE_RELEASE_TAG" \
            --arg revision "$EVENT_HEAD_SHA" \
            --argjson release_id "$BOTTLE_RELEASE_ID" '
              .id == $release_id and
              .tag_name == $tag and
              .target_commitish == $revision and
              .draft == true and
              .prerelease == false and
              .immutable == false
            ' "$RUNNER_TEMP/draft-bottle-release.json" >/dev/null
          jq -r '.assets[].id' "$RUNNER_TEMP/draft-bottle-release.json" |
            while read -r asset_id; do
              [[ "$asset_id" =~ ^[1-9][0-9]*$ ]]
              gh api --method DELETE \
                "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
            done
          gh api "repos/${GITHUB_REPOSITORY}/releases/${BOTTLE_RELEASE_ID}" \
            > "$RUNNER_TEMP/empty-draft-bottle-release.json"
          jq -e '.draft == true and (.assets | length) == 0' \
            "$RUNNER_TEMP/empty-draft-bottle-release.json" >/dev/null
          echo "release-id=$BOTTLE_RELEASE_ID" >> "$GITHUB_OUTPUT"

      - name: Recheck current parent, exact head, pull request, and allowlist
        if: steps.publication.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ steps.pull-request.outputs.number }}
          VERIFIED_BASE_SHA: ${{ steps.pull-request.outputs.base_sha }}
        run: |
          live_main="$(
            git ls-remote origin refs/heads/main |
              awk 'NR == 1 { print $1 }'
          )"
          remote_head="$(
            git ls-remote origin "refs/heads/${EVENT_HEAD_BRANCH}" |
              awk 'NR == 1 { print $1 }'
          )"
          test "$live_main" = "$VERIFIED_BASE_SHA"
          test "$remote_head" = "$EVENT_HEAD_SHA"

          commit_json="$RUNNER_TEMP/final-head-commit.json"
          gh api \
            "repos/${GITHUB_REPOSITORY}/commits/${EVENT_HEAD_SHA}" \
            > "$commit_json"
          jq -e \
            --arg head_sha "$EVENT_HEAD_SHA" \
            --arg base_sha "$VERIFIED_BASE_SHA" '
              .sha == $head_sha and
              (.parents | length) == 1 and
              .parents[0].sha == $base_sha
            ' "$commit_json" >/dev/null

          pr_json="$(
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${PULL_REQUEST}"
          )"
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg branch "$EVENT_HEAD_BRANCH" \
            --arg head_sha "$EVENT_HEAD_SHA" \
            --arg base_sha "$VERIFIED_BASE_SHA" '
              .state == "open" and
              .base.ref == "main" and
              .base.sha == $base_sha and
              .head.repo.full_name == $repository and
              .head.ref == $branch and
              .head.sha == $head_sha and
              .user.login == "github-actions[bot]" and
              .user.type == "Bot"
            ' <<<"$pr_json" >/dev/null

          files_path="$RUNNER_TEMP/pre-publication-files.jsonl"
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls/${PULL_REQUEST}/files" \
            > "$files_path"
          jq -se '
            flatten |
            length == 2 and
            all(
              (.status == "added" or .status == "modified") and
              (has("previous_filename") | not)
            )
          ' "$files_path" >/dev/null
          changed_files="$(
            jq -sr 'flatten | .[].filename' "$files_path" |
              LC_ALL=C sort
          )"
          expected_files=$'Formula/git-slop.rb\nmetadata/git-slop-release.json'
          test "$changed_files" = "$expected_files"

      - name: Pull the event-bound exact-head bottles
        if: steps.publication.outputs.published != 'true'
        id: pull-bottles
        # All release handoff workflows share this concurrency group. A newer
        # exact-head test therefore cannot complete while publication runs.
        env:
          BOTTLE_ROOT_URL: https://github.com/${{ github.repository }}/releases/download/${{ steps.bottle-release.outputs.tag }}
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_GIT_COMMITTER_NAME: ${{ steps.git_setup.outputs.name }}
          HOMEBREW_GIT_COMMITTER_EMAIL: ${{ steps.git_setup.outputs.email }}
          PULL_REQUEST: ${{ steps.pull-request.outputs.number }}
          VERIFIED_BASE_SHA: ${{ steps.pull-request.outputs.base_sha }}
        run: |
          live_main="$(
            git ls-remote origin refs/heads/main |
              awk 'NR == 1 { print $1 }'
          )"
          remote_head="$(
            git ls-remote origin "refs/heads/${EVENT_HEAD_BRANCH}" |
              awk 'NR == 1 { print $1 }'
          )"
          test "$live_main" = "$VERIFIED_BASE_SHA"
          test "$remote_head" = "$EVENT_HEAD_SHA"

          brew pr-pull \
            --debug \
            --no-upload \
            --retain-bottle-dir \
            --tap="$GITHUB_REPOSITORY" \
            --head-sha="$EVENT_HEAD_SHA" \
            --root-url="$BOTTLE_ROOT_URL" \
            --workflows=release-tests.yml \
            "$PULL_REQUEST"

      - name: Merge and upload exact bottles to the draft
        if: steps.publication.outputs.published != 'true'
        env:
          BOTTLE_PATH: ${{ steps.pull-bottles.outputs.bottle_path }}
          BOTTLE_RELEASE_ID: ${{ steps.prepare-bottle-release.outputs.release-id }}
          BOTTLE_RELEASE_TAG: ${{ steps.bottle-release.outputs.tag }}
          BOTTLE_ROOT_URL: https://github.com/${{ github.repository }}/releases/download/${{ steps.bottle-release.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
          HOMEBREW_GIT_COMMITTER_NAME: ${{ steps.git_setup.outputs.name }}
          HOMEBREW_GIT_COMMITTER_EMAIL: ${{ steps.git_setup.outputs.email }}
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          test -d "$BOTTLE_PATH"
          [[ "$BOTTLE_RELEASE_ID" =~ ^[1-9][0-9]*$ ]]
          mapfile -d '' bottle_json < <(
            find "$BOTTLE_PATH" -type f -name '*.bottle.json' -print0 |
              sort -z
          )
          test "${#bottle_json[@]}" = 2
          brew bottle --merge --write \
            --root-url="$BOTTLE_ROOT_URL" \
            "${bottle_json[@]}"
          grep -F "root_url \"${BOTTLE_ROOT_URL}\"" Formula/git-slop.rb

          mapfile -d '' bottles < <(
            find "$BOTTLE_PATH" -type f -name '*.bottle.tar.gz' -print0 |
              sort -z
          )
          test "${#bottles[@]}" = 2
          for bottle in "${bottles[@]}"; do
            name="$(basename "$bottle")"
            [[ "$name" =~ ^git-slop-${RELEASE_VERSION}\.(arm64_tahoe|x86_64_linux)\.bottle\.tar\.gz$ ]]
            curl --fail-with-body --silent --show-error \
              --connect-timeout 15 --max-time 300 \
              --request POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@${bottle}" \
              "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${BOTTLE_RELEASE_ID}/assets?name=${name}" \
              >/dev/null
          done
          gh api "repos/${GITHUB_REPOSITORY}/releases/${BOTTLE_RELEASE_ID}" \
            > "$RUNNER_TEMP/uploaded-draft-bottle-release.json"
          jq -e \
            --arg tag "$BOTTLE_RELEASE_TAG" \
            --argjson release_id "$BOTTLE_RELEASE_ID" '
              .id == $release_id and
              .tag_name == $tag and
              .draft == true and
              .immutable == false and
              (.assets | length) == 2 and
              all(.assets[];
                (.size | type == "number") and .size > 0 and
                (.digest | type == "string") and
                (.digest | test("^sha256:[0-9a-f]{64}$"))
              )
            ' "$RUNNER_TEMP/uploaded-draft-bottle-release.json" >/dev/null

      - name: Push bottle and formula commits
        if: steps.publication.outputs.published != 'true'
        uses: Homebrew/actions/git-try-push@df4b09108a1de9d6f995fe68f302b3f68bd6d2ef # 2026.07.20.1
        with:
          branch: main

      - name: Publish the complete draft and verify immutability
        env:
          BOTTLE_RELEASE_ID: ${{ steps.prepare-bottle-release.outputs.release-id || steps.bottle-release.outputs.release-id }}
          BOTTLE_RELEASE_TAG: ${{ steps.bottle-release.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          [[ "$BOTTLE_RELEASE_ID" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/${GITHUB_REPOSITORY}/releases/${BOTTLE_RELEASE_ID}" \
            > "$RUNNER_TEMP/bottle-release.json"
          jq -e \
            --arg tag "$BOTTLE_RELEASE_TAG" \
            --arg revision "$EVENT_HEAD_SHA" \
            --arg version "$RELEASE_VERSION" '
              .tag_name == $tag and
              .target_commitish == $revision and
              .prerelease == false and
              (.assets | length) == 2 and
              ([.assets[].name] | unique | length) == 2 and
              all(.assets[];
                (.size | type == "number") and .size > 0 and
                (.digest | type == "string") and
                (.digest | test("^sha256:[0-9a-f]{64}$")) and
                (.name | test("^git-slop-" + $version + "\\.(arm64_tahoe|x86_64_linux)\\.bottle\\.tar\\.gz$"))
              ) and
              ([.assets[].name | select(test("\\.arm64_tahoe\\.bottle\\.tar\\.gz$"))] | length) == 1 and
              ([.assets[].name | select(test("\\.x86_64_linux\\.bottle\\.tar\\.gz$"))] | length) == 1
            ' "$RUNNER_TEMP/bottle-release.json" >/dev/null
          if test "$(jq -r .draft "$RUNNER_TEMP/bottle-release.json")" = true; then
            jq -e '.immutable == false' "$RUNNER_TEMP/bottle-release.json" >/dev/null
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/releases/${BOTTLE_RELEASE_ID}" \
              -F draft=false \
              > "$RUNNER_TEMP/published-bottle-release.json"
          else
            jq -e '.immutable == true' "$RUNNER_TEMP/bottle-release.json" >/dev/null
          fi
          for attempt in $(seq 1 30); do
            if gh api "repos/${GITHUB_REPOSITORY}/releases/${BOTTLE_RELEASE_ID}" > "$RUNNER_TEMP/immutable-bottle-release.json" 2>/dev/null &&
              jq -e --arg tag "$BOTTLE_RELEASE_TAG" '
                .tag_name == $tag and
                .draft == false and
                .prerelease == false and
                .immutable == true
              ' "$RUNNER_TEMP/immutable-bottle-release.json" >/dev/null
            then
              exit 0
            fi
            if test "$attempt" -lt 30; then
              sleep 2
            fi
          done
          echo "Bottle release ${BOTTLE_RELEASE_TAG} did not become immutable after publication." >&2
          exit 1

      - name: Delete the exact automation branch
        if: steps.publication.outputs.published != 'true'
        run: |
          remote_sha="$(
            git ls-remote origin "refs/heads/${EVENT_HEAD_BRANCH}" |
              awk 'NR == 1 { print $1 }'
          )"
          if [[ -z "$remote_sha" ]]; then
            exit 0
          fi
          if [[ "$remote_sha" != "$EVENT_HEAD_SHA" ]]; then
            echo "::warning::Automation branch advanced; preserving newer head ${remote_sha}."
            exit 0
          fi
          if ! git push \
            --force-with-lease="refs/heads/${EVENT_HEAD_BRANCH}:${EVENT_HEAD_SHA}" \
            origin ":refs/heads/${EVENT_HEAD_BRANCH}"
          then
            echo "::warning::Exact-head automation branch cleanup was skipped."
          fi

      - name: Summarize trusted-main publication
        if: always()
        env:
          ALREADY_PUBLISHED: ${{ steps.publication.outputs.published }}
          PULL_REQUEST: ${{ steps.pull-request.outputs.number }}
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          {
            echo "## Trusted-main git-slop publication"
            echo
            echo "- Release-test run: ${EVENT_RUN_URL}"
            echo "- Event run ID: \`${EVENT_RUN_ID}\`"
            echo "- Formula head: \`${EVENT_HEAD_SHA}\`"
            echo "- Formula branch: \`${EVENT_HEAD_BRANCH}\`"
            echo "- Release version: \`${RELEASE_VERSION}\`"
            echo "- Already published on main: \`${ALREADY_PUBLISHED}\`"
            if [[ -n "$PULL_REQUEST" ]]; then
              echo "- Pull request: #${PULL_REQUEST}"
              echo "- Result: the event-bound bottles and formula were published automatically from trusted main."
            elif [[ "$ALREADY_PUBLISHED" == "true" ]]; then
              echo "- Result: exact metadata and the canonical two-platform bottle formula were already on main."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
