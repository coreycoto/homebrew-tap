name: brew test-bot

run-name: >-
  brew test-bot for
  ${{ github.event.pull_request.head.sha || github.sha }}

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

concurrency:
  group: test-bot-${{ github.event.pull_request.head.sha || github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  test-bot:
    name: Test and bottle (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-26
          - name: Linux x86-64
            os: ubuntu-latest
            container:
              image: >-
                ghcr.io/homebrew/brew@sha256:9df6f3bf046e72dbe5c89cf665afbb4c5a09112ed0152c75ca51dbf5def13aba
              options: --privileged
    runs-on: ${{ matrix.os }}
    container: ${{ fromJSON(toJSON(matrix.container)) }} # zizmor: ignore[unpinned-images]
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    env:
      TEST_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@df4b09108a1de9d6f995fe68f302b3f68bd6d2ef # 2026.07.20.1
        with:
          brew-gh-api-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check out the exact test head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.TEST_HEAD_SHA }}

      - name: Trust the exact checked-out workspace
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          test "$(git rev-parse HEAD)" = "$TEST_HEAD_SHA"

      - name: Verify trusted release workflow contracts
        run: scripts/verify-workflow-contracts.sh

      - name: Test bottle root URL rewriting
        run: scripts/rewrite-bottle-root-url.test.sh

      - name: Test bottle archive identity
        run: scripts/verify-bottle-archive.test.sh

      - name: Detect formula changes
        id: formula_change
        run: |
          formula_changes="$(
            git diff --name-only --no-renames origin/main...HEAD -- Formula/
          )"
          if [[ -z "$formula_changes" ]]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            printf 'Changed formula paths:\n%s\n' "$formula_changes"
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Test the fail-closed release verifier
        run: scripts/verify-git-slop-release.test.sh

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - name: Clean up before test-bot
        run: brew test-bot --only-cleanup-before

      - name: Set up test-bot
        run: brew test-bot --only-setup

      - name: Audit tap syntax
        run: brew test-bot --only-tap-syntax

      - name: Build, bottle, install, and test changed formulae
        if: github.event_name == 'pull_request'
        run: brew test-bot --only-formulae

      - name: Require a bottle artifact
        if: steps.formula_change.outputs.changed == 'true'
        run: compgen -G '*.bottle.*' >/dev/null

      - name: Upload pull-request bottles as diagnostics
        if: always() && steps.formula_change.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pull-request-bottles_${{ matrix.os }}
          path: '*.bottle.*'
          if-no-files-found: error
          retention-days: 1
